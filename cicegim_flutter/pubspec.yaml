name: cicegim_flutter
description: Gemini AI destekli bitki bakım ve tanıma uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Gemini AI Integration
  google_generative_ai: ^0.2.2

  # Image Handling
  image_picker: ^1.0.7
  image: ^4.1.7

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # HTTP & API
  http: ^1.2.0

  # State Management
  provider: ^6.1.1

  # Date & Time
  intl: ^0.19.0

  # UI Components
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Uncomment if you have custom fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
